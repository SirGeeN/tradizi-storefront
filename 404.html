<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRADIZI — Download the App</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0D1117;
      color: #E6EDF3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 360px; width: 100%; }
    .logo { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 32px; font-weight: 700; color: #1E7A4F; margin-bottom: 8px; }
    p { font-size: 15px; color: #9EAAB6; line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-block;
      background: #1E7A4F;
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
    }
    .btn:hover { background: #2fb16f; }
    .sub { margin-top: 16px; font-size: 13px; color: #6B7280; }
  </style>
  <script>
    // If URL contains /shop/ — this is a storefront deep link
    // Redirect to Play Store to download the app
    const path = window.location.pathname;
    const PLAY_STORE = 'https://play.google.com/store/apps/details?id=app.tradeeasy.ng';
    if (path.indexOf('/shop/') === 0 || path === '/shop') {
      window.location.replace(PLAY_STORE);
    }
  </script>
</head>
<body>
  <div class="card">
    <div class="logo">🏪</div>
    <h1>TRADIZI</h1>
    <p id="msg">A business shared their TRADIZI store with you. Download the app to view their products and place orders.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=app.tradeeasy.ng">
      Download TRADIZI Free
    </a>
    <p class="sub">Free on Google Play Store</p>
  </div>
  <script>
    // Update message based on URL context
    const path = window.location.pathname;
    if (path.indexOf('/shop/') !== 0) {
      document.getElementById('msg').textContent =
        'The page you are looking for does not exist. Go back to TRADIZI.';
      document.querySelector('.btn').href = '/';
      document.querySelector('.btn').textContent = 'Go to TRADIZI';
    }
  </script>
</body>
</html>
