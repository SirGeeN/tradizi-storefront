<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRADIZI — Business App for Nigerian Traders</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0D1117;
      color: #E6EDF3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 400px; width: 100%; }
    .logo { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 40px; font-weight: 700; color: #1E7A4F; margin-bottom: 8px; }
    .tagline { font-size: 16px; color: #9EAAB6; line-height: 1.6; margin-bottom: 40px; }
    .btn {
      display: inline-block;
      background: #1E7A4F;
      color: #fff;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
    }
    .sub { margin-top: 16px; font-size: 13px; color: #6B7280; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏪</div>
    <h1>TRADIZI</h1>
    <p class="tagline">
      The All-in-One Business App for Nigerian Traders.<br>
      Track sales, manage inventory, and grow your business.
    </p>
    <a class="btn" href="https://play.google.com/apps/internaltest/4701749624321956555">
      Download Free on Google Play
    </a>
    <p class="sub">Available on Android</p>
  </div>
</body>
</html>
